<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do list – SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body class="account-page" data-page="todos">
  <header class="account-header">
    <a class="account-logo" href="home.html"><span>S</span> SMS</a>
    <nav aria-label="Main navigation">
      <a href="home.html">Courses</a>
      <a href="dashboard.html">Overview</a>
      <a href="profile.html">Profile</a>
      <a href="login-history.html">Login history</a>
      <a class="current" href="todo.html">ToDo</a>
      <button class="account-logout" type="button" data-logout>Log out</button>
    </nav>
  </header>
  <main class="account-main">
    <p class="demo-notice" data-demo-notice hidden>Browser demo only: tasks are saved in this browser and are not synced to an account.</p>
    <div class="page-heading">
      <div><p class="account-eyebrow">Your time, your priorities</p><h1 class="page-title">ToDo list</h1><p class="account-muted"><span data-todo-progress>0 of 0 tasks completed</span></p></div>
      <a class="button-secondary" href="/api/account/todos.xlsx" data-api-path="/api/account/todos.xlsx">↓ &nbsp;Export Excel</a>
    </div>
    <section class="account-card task-card">
      <h2>Add a task</h2>
      <form id="todoForm" class="todo-form">
        <div><label for="todoTitle">What do you need to do?</label><input id="todoTitle" type="text" maxlength="255" placeholder="e.g. Review lecture notes" required></div>
        <div><label for="todoDueDate">Due date <span>(optional)</span></label><input id="todoDueDate" type="date"></div>
        <button class="button-primary" type="submit">Add task</button>
      </form>
    </section>
    <section class="account-card task-list-card">
      <h2>Your tasks</h2>
      <ul id="todoList" class="todo-list"><li class="empty-state">Loading your tasks…</li></ul>
    </section>
  </main>
  <p class="account-status" data-status role="status" aria-live="polite"></p>
  <script src="js/config.js?v=2"></script>
  <script src="js/demo-api.js?v=1"></script>
  <script src="js/account.js?v=5"></script>
</body>
</html>
