<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page d-flex flex-column align-items-center justify-content-center py-4 px-3">
  <div class="text-center mb-4">
    <div class="logo">M</div>
    <h1 class="h3 fw-bold">Welcome Back!</h1>
    <p class="text-secondary mb-0">Sign in to continue to your account.</p>
  </div>

  <main class="card login-card bg-white">
    <h2 class="h5 fw-bold">Login to your account</h2>
    <p class="text-secondary small mb-4">Enter your email and password to get started.</p>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" autocomplete="email">
        <div class="invalid-feedback" id="emailError"></div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <label class="form-label" for="password">Password</label>
          <a class="link-purple" href="#" id="forgot">Forget password?</a>
        </div>
        <div class="input-group has-validation">
          <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="btn toggle" id="toggle" aria-label="Show password">Show</button>
          <div class="invalid-feedback" id="passError"></div>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember">
        <label class="form-check-label text-secondary" for="remember">Remember me</label>
      </div>
      <button type="submit" class="btn signin w-100">Sign In</button>
    </form>

    <p class="text-center text-secondary small mt-4 mb-0">Don't have an account? <a class="link-purple" href="#" id="create">Create an account</a></p>
  </main>

  <p class="text-secondary small mt-4 mb-0">© 2026 My Website. All rights reserved.</p>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
