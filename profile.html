<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile – SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body class="account-page" data-page="profile">
  <header class="account-header">
    <a class="account-logo" href="home.html"><span>S</span> SMS</a>
    <nav aria-label="Main navigation">
      <a href="home.html">Courses</a>
      <a href="dashboard.html">Overview</a>
      <a class="current" href="profile.html">Profile</a>
      <a href="login-history.html">Login history</a>
      <a href="todo.html">ToDo</a>
      <button class="account-logout" type="button" data-logout>Log out</button>
    </nav>
  </header>
  <main class="account-main narrow-main">
    <p class="account-eyebrow">Your account</p>
    <h1 class="page-title">Profile</h1>
    <section class="account-card profile-card">
      <div class="profile-overview">
        <div class="profile-avatar">
          <img alt="Your profile photo" data-profile-image hidden>
          <span data-avatar-initial aria-hidden="true">S</span>
        </div>
        <div><p class="account-eyebrow">Account overview</p><h2 data-user-name>Account</h2></div>
        <form id="imageForm" class="image-form">
          <label for="profileImageFile" class="button-secondary">Choose photo</label>
          <input id="profileImageFile" type="file" accept="image/png,image/jpeg,image/gif" hidden>
          <button class="button-primary" type="submit">Upload photo</button>
          <p class="account-hint">PNG, JPEG, or GIF · up to 5 MB</p>
        </form>
      </div>
      <div class="profile-details">
        <div><span>Name</span><strong data-user-name>Account</strong></div>
        <div><span>Email</span><strong data-user-email></strong></div>
      </div>
      <form id="passwordForm" class="account-form">
        <h2>Change password</h2>
        <p class="account-muted">Enter your current password and choose a new one.</p>
        <label for="currentPassword">Current password</label>
        <input id="currentPassword" type="password" autocomplete="current-password" required>
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="72" required aria-describedby="passwordHint">
        <small id="passwordHint">Use at least 6 characters.</small>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="72" required>
        <button class="button-primary" type="submit">Update password</button>
      </form>
    </section>
  </main>
  <p class="account-status" data-status role="status" aria-live="polite"></p>
  <script src="js/config.js?v=1"></script>
  <script src="js/account.js?v=3"></script>
</body>
</html>
